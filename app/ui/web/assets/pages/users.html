<div class="panel">
  <h3>User Management</h3>
  
  <!-- Tab Navigation -->
  <div class="tabs">
    <button class="tab-button active" data-tab="admin">Admin Users</button>
    <button class="tab-button" data-tab="client">Client Users</button>
  </div>
  
  <!-- Admin Users Tab -->
  <div class="tab-content active" id="admin-tab">
    <div class="settings-block">
      <h4>Admin Users</h4>
      <p class="description">Administrative users with full WebUI access</p>
      <div id="admin-users-list"></div>
      <button class="btn btn-primary" id="add-admin-user">Add Admin User</button>
    </div>
  </div>
  
  <!-- Client Users Tab -->
  <div class="tab-content" id="client-tab">
    <div class="settings-block">
      <h4>Client Users</h4>
      <p class="description">Client users for WebDAV, browser interface, and FTP access</p>
      <div id="client-users-list"></div>
      <button class="btn btn-primary" id="add-client-user">Add Client User</button>
    </div>
  </div>
</div>

<!-- Admin User Modal -->
<div id="admin-modal" class="modal" style="display:none;">
  <div class="modal-content">
    <h4 id="admin-modal-title">Add Admin User</h4>
    <form id="admin-user-form">
      <label>Username
        <input type="text" id="admin-username" required>
      </label>
      <label>Password
        <input type="password" id="admin-password" required>
      </label>
      <label>Enabled
        <input type="checkbox" id="admin-enabled" checked>
      </label>
      <div class="modal-actions">
        <button type="button" class="btn" onclick="closeAdminModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- Client User Modal -->
<div id="client-modal" class="modal" style="display:none;">
  <div class="modal-content">
    <h4 id="client-modal-title">Add Client User</h4>
    <form id="client-user-form">
      <label>Username
        <input type="text" id="client-username" required>
      </label>
      <label>Password
        <input type="password" id="client-password" required>
      </label>
      <label>Share
        <select id="client-share" required></select>
      </label>
      <div class="check-row">
        <label><input type="checkbox" id="client-enabled" checked> Enabled</label>
        <label><input type="checkbox" id="client-login" checked> Login</label>
        <label><input type="checkbox" id="client-read" checked> Read</label>
        <label><input type="checkbox" id="client-write"> Write</label>
        <label><input type="checkbox" id="client-cache" checked> Cache</label>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" onclick="closeClientModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- API Keys Section (kept for backward compatibility) -->
<div class="panel">
  <h3>API Keys</h3>
  <div id="api-keys-list"></div>
  <div class="settings-block">
    <h4>Generate API Key</h4>
    <label>Username
      <input type="text" id="api-key-username" placeholder="admin">
    </label>
    <button class="btn btn-primary" id="api-key-generate-btn" type="button">Generate Key</button>
    <div id="api-key-status" class="status-msg"></div>
  </div>
</div>
