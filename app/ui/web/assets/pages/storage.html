<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CacheInfinity Storage Browser</title>
    <link rel="stylesheet" href="/assets/css/styles.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <style>
      /* File Manager Specific Styles */
      .file-manager {
        display: flex;
        flex-direction: column;
        gap: var(--gap-md);
        min-height: 60vh;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: var(--gap-sm);
        align-items: center;
        padding: 14px;
        background: var(--panel-soft);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
      }

      .toolbar-group {
        display: flex;
        gap: 6px;
        align-items: center;
      }

      .toolbar-divider {
        width: 1px;
        height: 24px;
        background: var(--border);
        margin: 0 6px;
      }

      .breadcrumbs {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        padding: 10px 14px;
        background: var(--panel-solid);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        font-size: 0.9rem;
      }

      .breadcrumb-item {
        display: flex;
        align-items: center;
        gap: 6px;
clip: 8px 12px;
        border-radius: var(--radius-sm);
        transition: all var(--transition);
        color: var(--muted);
        cursor: pointer;
      }

      .breadcrumb-item:hover {
        background: var(--panel-soft);
        color: var(--ink-strong);
      }

      .breadcrumb-item.active {
        color: var(--accent-alt);
        font-weight: 600;
      }

      .breadcrumb-separator {
        color: var(--muted);
        font-size: 0.8rem;
      }

      .file-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: var(--gap-md);
        padding: 16px;
        background: var(--panel-solid);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        min-height: 300px;
      }

      .file-list {
        display: flex;
        flex-direction: column;
        gap: 0;
        background: var(--panel-solid);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        overflow: hidden;
      }

      .file-item {
        padding: 12px 14px;
        display: flex;
        align-items: center;
        gap: 12px;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
        transition: all var(--transition);
      }

      .file-item:last-child {
        border-bottom: none;
      }

      .file-item:hover {
        background: var(--panel-soft);
      }

      .file-item.selected {
        background: var(--accent-soft);
        border-color: var(--border-focus);
      }

      .file-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 14px;
        background: var(--panel-solid);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: all var(--transition);
        text-align: center;
      }

      .file-card:hover {
        background: var(--panel-soft);
        transform: translateY(-2px);
        box-shadow: var(--shadow-sm);
      }

      .file-card.selected {
        background: var(--accent-soft);
        border-color: var(--accent-alt);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .file-icon {
        width: 48px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        flex-shrink: 0;
      }

      .file-icon.sm {
        width: 32px;
        height: 32px;
        font-size: 1.5rem;
      }

      .file-name {
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--ink);
        word-break: break-word;
        max-width: 100%;
      }

      .file-meta {
        font-size: 0.75rem;
        color: var(--muted);
      }

      .file-actions {
        display: flex;
        gap: 4px;
        margin-left: auto;
      }

      .view-toggle {
        display: flex;
        gap: 4px;
        background: var(--panel-solid);
        padding: 4px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
      }

      .view-toggle button {
        padding: 6px 10px;
        background: transparent;
        border: none;
        color: var(--muted);
        cursor: pointer;
        border-radius: var(--radius-sm);
        transition: all var(--transition);
      }

      .view-toggle button:hover {
        background: var(--panel-soft);
        color: var(--ink);
      }

      .view-toggle button.active {
        background: var(--accent-alt);
        color: #fff;
      }

      .search-box {
        position: relative;
        flex: 1;
        max-width: 400px;
      }

      .search-box input {
        width: 100%;
        padding-left: 36px;
      }

      .search-box svg {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--muted);
        pointer-events: none;
      }

      .drop-zone {
        border: 2px dashed var(--border);
        border-radius: var(--radius-md);
        padding: 48px 24px;
        text-align: center;
        background: var(--panel-soft);
        transition: all var(--transition);
      }

      .drop-zone.drag-over {
        border-color: var(--accent-alt);
        background: var(--accent-soft);
      }

      .drop-zone-icon {
        font-size: 3rem;
        margin-bottom: 12px;
      }

      .context-menu {
        position: fixed;
        background: var(--panel-solid);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow);
        padding: 6px;
        z-index: 1000;
        min-width: 180px;
      }

      .context-menu-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        transition: all var(--transition);
        color: var(--ink);
        font-size: 0.9rem;
      }

      .context-menu-item:hover {
        background: var(--panel-soft);
      }

      .context-menu-item.danger:hover {
        background: var(--error-soft);
        color: var(--error);
      }

      .context-menu-divider {
        height: 1px;
        background: var(--border);
        margin: 4px 0;
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(4px);
        z-index: 999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .modal {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow);
        max-width: 500px;
        width: 100%;
        max-height: 90vh;
        overflow-y: auto;
      }

      .modal-header {
        padding: 20px 24px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .modal-body {
        padding: 24px;
      }

      .modal-footer {
        padding: 16px 24px;
        border-top: 1px solid var(--border);
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }

      .selection-bar {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--panel-solid);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 12px 20px;
        box-shadow: var(--shadow);
        display: flex;
        align-items: center;
        gap: 16px;
        z-index: 100;
      }

      .selection-count {
        font-weight: 600;
        color: var(--accent-alt);
      }
    </style>
  </head>
  <body data-page="storage"{% if theme %} data-theme="{{ theme }}"{% endif %}>
    <header class="topbar">
      <div class="brand">
        <span>CacheInfinity</span>
        <small>Storage Browser</small>
      </div>
      <nav class="nav">
        <a href="/" data-nav="dashboard">Dashboard</a>
        <a href="/overview" data-nav="overview">Overview</a>
        <a href="/storage" data-nav="storage">Storage</a>
        <a href="/cachelinks" data-nav="cachelinks">Cachelinks</a>
        <a href="/settings" data-nav="settings">Settings</a>
        <a href="/users" data-nav="users">Users</a>
        <a href="/cookies" data-nav="cookies">Cookies</a>
        <a href="/maintenance" data-nav="maintenance">Maintenance</a>
      </nav>
      <div class="session">
        <span id="session-user">Signed in</span>
        <button class="button" id="logout-button">Log out</button>
      </div>
    </header>

    <main class="page">
      <section class="hero">
        <div>
          <h1>
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: inline-block; vertical-align: middle; margin-right: 8px;">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            </svg>
            Storage Browser
          </h1>
          <p>Explore datadir and staging areas with a comprehensive file management interface.</p>
        </div>
        <div class="hero-meta">
          <span class="badge info" id="storage-type-badge">Datadir</span>
          <span class="badge" id="path-badge">/</span>
        </div>
      </section>

      <!-- Storage Summary -->
      <section class="section" style="--delay:0.05s;">
        <div class="section-header">
          <h2>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: inline-block; vertical-align: middle; margin-right: 6px;">
              <rect x="3" y="3" width="7" height="7"/>
              <rect x="14" y="3" width="7" height="7"/>
              <rect x="14" y="14" width="7" height="7"/>
              <rect x="3" y="14" width="7" height="7"/>
            </svg>
            Storage Summary
          </h2>
          <button class="button ghost sm" id="refresh-summary">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="23 4 23 10 17 10"/>
              <polyline points="1 20 1 14 7 14"/>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
            </svg>
            Refresh
          </button>
        </div>
        <div id="storage-summary">
          <div class="grid cols-3">
            <div class="skeleton" style="height: 80px;"></div>
            <div class="skeleton" style="height: 80px;"></div>
            <div class="skeleton" style="height: 80px;"></div>
          </div>
        </div>
      </section>

      <!-- File Manager -->
      <section class="section" style="--delay:0.1s;">
        <div class="file-manager">
          <!-- Toolbar -->
          <div class="toolbar">
            <div class="toolbar-group">
              <select class="select" id="storage-location" style="min-width: 120px;">
                <option value="datadir">📁 Datadir</option>
                <option value="staging">📦 Staging</option>
              </select>
            </div>

            <div class="toolbar-divider"></div>

            <div class="toolbar-group">
              <button class="button sm" id="btn-upload" title="Upload files">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                  <polyline points="17 8 12 3 7 8"/>
                  <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                Upload
              </button>
              <button class="button sm" id="btn-new-folder" title="Create folder">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                  <line x1="12" y1="11" x2="12" y2="17"/>
                  <line x1="9" y1="14" x2="15" y2="14"/>
                </svg>
                New Folder
              </button>
              <button class="button sm" id="btn-refresh" title="Refresh">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="23 4 23 10 17 10"/>
                  <polyline points="1 20 1 14 7 14"/>
                  <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                </svg>
              </button>
            </div>

            <div class="toolbar-divider"></div>

            <div class="search-box">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/>
                <path d="m21 21-4.35-4.35"/>
              </svg>
              <input type="text" class="input" id="search-input" placeholder="Search files and folders...">
            </div>

            <div class="toolbar-divider"></div>

            <div class="toolbar-group">
              <label class="field inline" style="margin: 0;">
                <input type="checkbox" id="show-hidden">
                <span style="font-size: 0.85rem;">Hidden</span>
              </label>
            </div>

            <div class="toolbar-divider"></div>

            <div class="view-toggle">
              <button id="view-grid" class="active" title="Grid view">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="3" width="7" height="7"/>
                  <rect x="14" y="3" width="7" height="7"/>
                  <rect x="14" y="14" width="7" height="7"/>
                  <rect x="3" y="14" width="7" height="7"/>
                </svg>
              </button>
              <button id="view-list" title="List view">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="8" y1="6" x2="21" y2="6"/>
                  <line x1="8" y1="12" x2="21" y2="12"/>
                  <line x1="8" y1="18" x2="21" y2="18"/>
                  <line x1="3" y1="6" x2="3.01" y2="6"/>
                  <line x1="3" y1="12" x2="3.01" y2="12"/>
                  <line x1="3" y1="18" x2="3.01" y2="18"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Breadcrumbs -->
          <div class="breadcrumbs" id="breadcrumbs">
            <div class="skeleton" style="width: 200px; height: 20px;"></div>
          </div>

          <!-- File Listing -->
          <div id="file-container">
            <div class="empty-state">
              <div class="empty-state-icon">📂</div>
              <h3>Loading...</h3>
              <div class="skeleton" style="width: 100%; height: 100px; margin-top: 16px;"></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Context Menu -->
    <div id="context-menu" class="context-menu hidden"></div>

    <!-- Modals -->
    <div id="modal-container"></div>

    <!-- Selection Bar -->
    <div id="selection-bar" class="selection-bar hidden">
      <span class="selection-count"></span>
      <div class="toolbar-divider"></div>
      <button class="button sm" id="btn-copy-selected">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
        Copy
      </button>
      <button class="button sm" id="btn-move-selected">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="5 9 2 12 5 15"/>
          <polyline points="9 5 12 2 15 5"/>
          <polyline points="15 19 12 22 9 19"/>
          <polyline points="19 9 22 12 19 15"/>
          <line x1="2" y1="12" x2="22" y2="12"/>
          <line x1="12" y1="2" x2="12" y2="22"/>
        </svg>
        Move
      </button>
      <button class="button sm danger" id="btn-delete-selected">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        </svg>
        Delete
      </button>
      <button class="button sm ghost" id="btn-deselect-all">Clear Selection</button>
    </div>

    <div id="toast" class="toast"></div>

    <script src="/assets/js/common.js"></script>
    <script src="/assets/js/storage.js"></script>
  </body>
</html>
