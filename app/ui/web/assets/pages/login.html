<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CacheInfinity Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <style>
    body {
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    .login-shell {
      width: min(420px, 90vw);
      background: var(--surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      padding: 2rem;
      box-shadow: var(--shadow-lg);
      animation: fadeUp 0.6s ease;
    }

    .login-shell h1 {
      margin: 0 0 0.5rem;
      font-size: 2rem;
    }

    .login-shell p {
      margin: 0 0 1.5rem;
      color: var(--muted);
    }

    .login-shell button {
      margin-top: 1.25rem;
      width: 100%;
    }
  </style>
</head>
<body>
  <form class="login-shell" method="POST" action="/login">
    <h1>CacheInfinity</h1>
    <p>Sign in to shape the cache, configure shares, and orchestrate remotes.</p>
    <label>Username
      <input type="text" name="username" autocomplete="username" autofocus required>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button class="btn btn-primary" type="submit">Enter Control Deck</button>
    {% if error %}
      <div class="status-msg error">{{ error }}</div>
    {% endif %}
  </form>
</body>
</html>
