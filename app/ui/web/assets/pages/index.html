<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CacheInfinity Control Center</title>
    <link rel="stylesheet" href="/assets/css/styles.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
</head>
<body>
    <div class="layout">
        <nav class="sidenav">
            <div class="logo">
                <div class="logo-icon">∞</div>
                <div>
                    <h1>CacheInfinity</h1>
                    <span>Control Panel</span>
                </div>
            </div>
            <div class="nav-label">Navigation</div>
            <div class="nav">
                <button class="nav-link active" data-page="overview"><span class="icon">📊</span>Overview</button>
                <button class="nav-link" data-page="storage"><span class="icon">💾</span>Storage</button>
                <button class="nav-link" data-page="cachelinks"><span class="icon">🗂️</span>Cachelinks</button>
                <button class="nav-link" data-page="cookies"><span class="icon">🍪</span>Cookies</button>
                <button class="nav-link" data-page="users"><span class="icon">👥</span>Users</button>
                <button class="nav-link" data-page="settings"><span class="icon">⚙️</span>Settings</button>
                <button class="nav-link" data-page="maintenance"><span class="icon">🧰</span>Maintenance</button>
            </div>
        </nav>
        <div class="content">
            <header class="topbar">
                <div>
                    <h1 id="page-title">Overview</h1>
                </div>
                <div class="topbar-right">
                    <div class="topbar-options" id="topbar-options"></div>
                    <div class="session-box">
                        <span class="session-user" id="session-user"></span>
                        <a class="logout-link" href="/logout">Logout</a>
                    </div>
                </div>
            </header>
            <main id="main-content">
                <!-- Page content will be loaded dynamically here -->
                <div id="page-container"></div>
            </main>
        </div>
    </div>
    
    <!-- Load common JavaScript -->
    <script src="/assets/js/common.js"></script>
    
    <script>
        const log = window.CILog || console;

        // Dynamic page loading mechanism
        async function loadPage(pageName) {
            try {
                // Show loading state
                const pageContainer = document.getElementById('page-container');
                pageContainer.innerHTML = '<div class="loading">Loading...</div>';
                
                // Load the page content
                const response = await fetch(`/assets/pages/${pageName}.html`);
                if (!response.ok) {
                    throw new Error(`Failed to load page: ${pageName}`);
                }
                
                const htmlContent = await response.text();
                pageContainer.innerHTML = htmlContent;
                
                // Load page-specific JavaScript as ES module
                const script = document.createElement('script');
                script.src = `/assets/js/${pageName}.js`;
                script.type = "module";
                script.onload = function() {
                    // Initialize page-specific functionality if available
                    // For ES modules, we need to use a different approach
                    const initFunctionName = `init${pageName.charAt(0).toUpperCase() + pageName.slice(1)}`;
                    if (typeof window[initFunctionName] === 'function') {
                        window[initFunctionName]();
                    } else {
                        log.debug(`Initialization function ${initFunctionName} not found for ${pageName}`);
                    }
                };
                script.onerror = function() {
                    log.debug(`Page-specific JS not found for ${pageName}`);
                };
                document.body.appendChild(script);
                
                // Update page title
                const titles = {
                    overview: 'Overview',
                    storage: 'Storage Management',
                    cachelinks: 'Cachelinks',
                    cookies: 'Cookie Management',
                    users: 'User Management',
                    settings: 'Settings',
                    maintenance: 'Maintenance'
                };
                document.getElementById('page-title').textContent = titles[pageName] || pageName;
                
            } catch (error) {
                log.error('Error loading page:', error);
                const pageContainer = document.getElementById('page-container');
                pageContainer.innerHTML = `<div class="error">Error loading page: ${error.message}</div>`;
            }
        }
        
        // Initialize the application when DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize navigation
            initNavigation();
            
            // Load the default page (overview)
            const defaultPage = 'overview';
            loadPage(defaultPage);
            
            // Refresh session periodically
            refreshSession();
            setInterval(refreshSession, 15000);
        });
    </script>
</body>
</html>
