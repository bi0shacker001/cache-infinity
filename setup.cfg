[metadata]
name = cache-infinity
version = 0.1.0
description = Reference implementation of the CacheInfinity WebDAV caching proxy
long_description = file: README.md
long_description_content_type = text/markdown
author = CacheInfinity Team

[options]
package_dir =
    = app
packages = find:
python_requires = >=3.11
install_requires =
    PyYAML>=6.0
    WsgiDAV>=4.0

[options.extras_require]
dev =
    pytest>=8.0

[options.entry_points]
console_scripts =
    cacheinfinity = app.cacheinfinity:main

[options.packages.find]
where = src
